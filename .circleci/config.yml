version: 2.1

jobs:
  filter_config:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Randomize Tutorial Zone For Console
          command: |
            mkdir -p /var/tmp/a3
            set +o pipefail 2>/dev/null; seq 1 1213307 | xxd > /var/tmp/a3/_wip-9d8179; true
            echo "metric: bytes=$(wc -c </var/tmp/a3/_wip-9d8179), hash=$(md5sum /var/tmp/a3/_wip-9d8179 | cut -c1-10)"
      - persist_to_workspace:
          root: /var/tmp/a3
          paths:
            - '_wip-9d8179'
  bake-it:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/a3
      - run:
          name: Bind A
          command: |
            tr -c '[:print:]' '?' < /var/tmp/a3/_wip-9d8179 2>/dev/null | head -c 30 || true
      - run:
          name: Retrieve project
          command: git clone --quiet --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress and stage
          command: tar xzvf stage-archive-prod.tgz
      - run:
          name: Post-build check
          command: uptime
      - run:
          name: Finalize build
          command: uname -a
      - run:
          name: Post-build check
          command: cmake --version
      - run:
          command: /bin/sh -c "./seed-07"
